    Experience:
      # TODO: add start_date (YYYY-MM). The draft CV lists "April 2026 – July 2026", which conflicts with
      # the Jan–Apr 2026 mentoring and the current NORMA affiliation, so dates are left out for now.
      - company: NORMA Inc.
        position: Quantum AI Developer, Quantum AI Team
        location: Seoul, Republic of Korea
        summary: Research and development of quantum machine learning models and the classical simulation tools used to train them.
        highlights:
          - Co-developed and maintain PADO-Pauli, a GPU-accelerated differentiable Pauli-propagation engine for large-scale circuit simulation and training (40–120 qubits), shipped as the Python package padopauli.
          - Proposed and analyzed mixed IQP-QCBMs, ancilla-extended IQP generative models with provable barren-plateau avoidance and a cluster initialization scheme; deployed 42-qubit mixed IQP Born machines on the Quantinuum H2 trapped-ion quantum computer.
          - Developed SAFE ma-QAOA, a surrogate-assisted, parameter-distilled multi-angle QAOA pipeline with exact fine-tuning (QCE26 oral).
          - Applied QGAN and IQP-QCBM models to molecular generation for KRAS G12D inhibitor candidates, with QAOA experiments on IonQ Forte.
          - Contributed to an in-house quantum SDK (circuit representation, user API, circuit output and visualization).

      - company: Qunova Computing
        position: Research Intern
        location: Daejeon, Republic of Korea
        start_date: 2023-10
        end_date: 2024-02
        highlights:
